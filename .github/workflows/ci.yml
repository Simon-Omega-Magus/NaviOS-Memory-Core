name: Verify NaviOS Memory Reflex

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m compileall -q plugins/navios-memory-reflex demo tests

      - name: Run focused tests
        run: python -m unittest -v tests/test_memory_reflex.py

      - name: Run deterministic demo
        run: python demo/run_demo.py --json > /tmp/navios-memory-reflex-demo.json
